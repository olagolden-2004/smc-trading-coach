<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SMC Risk Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #ffffff;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aab4c3;
      margin-bottom: 25px;
    }

    .card {
      background: #111b2e;
      border: 1px solid #26344d;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 7px;
      color: #dbe4f0;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #3b4b65;
      background: #0d1728;
      color: #ffffff;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      line-height: 1.8;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      border-bottom: 1px solid #26344d;
      padding: 10px 0;
    }

    .value {
      font-weight: bold;
      text-align: right;
    }

    .warning {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      background: #241c0d;
      border: 1px solid #735a21;
      color: #f5d98b;
      font-size: 13px;
    }

    .safe {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      background: #10251a;
      border: 1px solid #285c3a;
      color: #9be0b5;
      font-size: 13px;
    }

    .error {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      background: #291416;
      border: 1px solid #71343a;
      color: #ffb4b4;
      font-size: 13px;
    }

    .info {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      background: #111d31;
      border: 1px solid #30466b;
      color: #b9c9e2;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SMC Risk Calculator</h1>

  <div class="subtitle">
    Calculate your forex trade risk before entering the market
  </div>

  <div class="card">

    <label>Currency Pair</label>

    <select id="pair">
      <option value="EURUSD">EUR/USD</option>
      <option value="GBPUSD">GBP/USD</option>
      <option value="USDJPY">USD/JPY</option>
      <option value="GBPJPY">GBP/JPY</option>
      <option value="EURJPY">EUR/JPY</option>
      <option value="EURGBP">EUR/GBP</option>
      <option value="AUDUSD">AUD/USD</option>
      <option value="NZDUSD">NZD/USD</option>
      <option value="USDCAD">USD/CAD</option>
      <option value="USDCHF">USD/CHF</option>
      <option value="AUDJPY">AUD/JPY</option>
      <option value="CADJPY">CAD/JPY</option>
      <option value="CHFJPY">CHF/JPY</option>
      <option value="EURCAD">EUR/CAD</option>
      <option value="GBPCAD">GBP/CAD</option>
      <option value="GBPAUD">GBP/AUD</option>
      <option value="EURAUD">EUR/AUD</option>
      <option value="AUDCAD">AUD/CAD</option>
      <option value="AUDCHF">AUD/CHF</option>
      <option value="NZDJPY">NZD/JPY</option>
    </select>

    <label>Broker Minimum Lot</label>

    <input
      type="number"
      id="brokerMinLot"
      value="0.01"
      min="0.001"
      step="0.001"
      placeholder="Example: 0.01"
    >

    <label>Account Balance ($)</label>

    <input
      type="number"
      id="balance"
      placeholder="Example: 1000"
      step="0.01"
    >

    <label>Risk (%)</label>

    <input
      type="number"
      id="riskPercent"
      value="1"
      min="0.01"
      step="0.01"
      placeholder="Example: 1"
    >

    <label>Entry Price</label>

    <input
      type="number"
      id="entry"
      placeholder="Example: 1.17500"
      step="0.00001"
    >

    <label>Stop Loss</label>

    <input
      type="number"
      id="stopLoss"
      placeholder="Example: 1.17000"
      step="0.00001"
    >

    <label>Take Profit</label>

    <input
      type="number"
      id="takeProfit"
      placeholder="Example: 1.18500"
      step="0.00001"
    >

    <button onclick="calculateRisk()">
      CALCULATE RISK
    </button>

  </div>

  <div class="card">

    <h2>Risk Results</h2>

    <div id="results">
      Enter your trade information above.
    </div>

  </div>

</div>

<script>
  function calculateRisk() {

  const pair =
    document.getElementById("pair").value;

  const balance =
    parseFloat(
      document.getElementById("balance").value
    );

  const riskPercent =
    parseFloat(
      document.getElementById("riskPercent").value
    );

  const entry =
    parseFloat(
      document.getElementById("entry").value
    );

  const stopLoss =
    parseFloat(
      document.getElementById("stopLoss").value
    );

  const takeProfit =
    parseFloat(
      document.getElementById("takeProfit").value
    );

  const brokerMinLot =
    parseFloat(
      document.getElementById("brokerMinLot").value
    );

  const results =
    document.getElementById("results");


  // ============================================
  // BASIC VALIDATION
  // ============================================

  if (
    !Number.isFinite(balance) ||
    !Number.isFinite(riskPercent) ||
    !Number.isFinite(entry) ||
    !Number.isFinite(stopLoss) ||
    !Number.isFinite(takeProfit) ||
    !Number.isFinite(brokerMinLot)
  ) {

    results.innerHTML = `
      <div class="error">
        Please enter all trade information.
      </div>
    `;

    return;
  }


  if (balance <= 0) {

    results.innerHTML = `
      <div class="error">
        Account balance must be greater than zero.
      </div>
    `;

    return;
  }


  if (riskPercent <= 0 || riskPercent > 100) {

    results.innerHTML = `
      <div class="error">
        Risk percentage must be between 0.01% and 100%.
      </div>
    `;

    return;
  }


  if (brokerMinLot <= 0) {

    results.innerHTML = `
      <div class="error">
        Broker minimum lot must be greater than zero.
      </div>
    `;

    return;
  }


  if (entry === stopLoss) {

    results.innerHTML = `
      <div class="error">
        Entry and Stop Loss cannot be the same.
      </div>
    `;

    return;
  }


  if (entry === takeProfit) {

    results.innerHTML = `
      <div class="error">
        Entry and Take Profit cannot be the same.
      </div>
    `;

    return;
  }


    // ============================================
  // PIP SIZE
  // ============================================

  const yenPairs = [
    "USDJPY",
    "GBPJPY",
    "EURJPY",
    "AUDJPY",
    "CADJPY",
    "CHFJPY",
    "NZDJPY"
  ];

  const pipSize =
    yenPairs.includes(pair)
      ? 0.01
      : 0.0001;


  // ============================================
// PIP VALUE
// ============================================

let pipValuePerLot;

// USD-quoted pairs
// Example: GBPUSD, EURUSD, AUDUSD
if (
  pair === "GBPUSD" ||
  pair === "EURUSD" ||
  pair === "AUDUSD" ||
  pair === "NZDUSD"
) {

  pipValuePerLot = 10;

}

// JPY pairs
// For pairs such as GBPJPY and EURJPY,
// convert the JPY pip value into USD
// using USDJPY.
else if (yenPairs.includes(pair)) {

  const usdJpyRate = 150;

  pipValuePerLot =
    (pipSize * 100000) / usdJpyRate;

}

// USD-based pairs
// Example: USDJPY
else if (pair === "USDJPY") {

  pipValuePerLot =
    (pipSize * 100000) / entry;

}

// Other pairs
else {

  pipValuePerLot = 10;

  }


  // ============================================
  // RISK AMOUNT
  // ============================================

  const riskAmount =
    balance * (riskPercent / 100);


  // ============================================
  // PRICE DISTANCES
  // ============================================

  const stopDistance =
    Math.abs(entry - stopLoss);

  const targetDistance =
    Math.abs(takeProfit - entry);


  if (stopDistance <= 0) {

    results.innerHTML = `
      <div class="error">
        Stop Loss distance must be greater than zero.
      </div>
    `;

    return;
  }


  // ============================================
  // PIP CALCULATIONS
  // ============================================

  const stopPips =
    stopDistance / pipSize;

  const targetPips =
    targetDistance / pipSize;


  // ============================================
  // STANDARD FOREX LOT CALCULATION
  //
  // Approximation:
  // 1 standard lot = 100,000 units
  //
  // For USD-quoted pairs:
  // approximately $10 per pip per 1 lot.
  //
  // For JPY and cross pairs, this calculator
  // uses a conservative simplified pip-value
  // estimate.
  // ============================================

  


  // ============================================
  // CALCULATE LOT SIZE
  // ============================================

  const riskPerOneLot =
    stopPips * pipValuePerLot;


  if (
    !Number.isFinite(riskPerOneLot) ||
    riskPerOneLot <= 0
  ) {

    results.innerHTML = `
      <div class="error">
        Unable to calculate the lot size.
      </div>
    `;

    return;
  }


  const calculatedLotSize =
    riskAmount / riskPerOneLot;


  const riskAtMinimumLot =
    riskPerOneLot * brokerMinLot;


  // ============================================
  // REWARD / RISK
  // ============================================

  const rewardRisk =
    targetDistance / stopDistance;


  // ============================================
  // BROKER MINIMUM CHECK
  // ============================================

  const minimumLotExceedsRisk =
    riskAtMinimumLot > riskAmount;


  let lotMessage = "";


  if (calculatedLotSize < brokerMinLot) {

    if (minimumLotExceedsRisk) {

      lotMessage = `
        <div class="warning">

          <strong>Broker minimum warning</strong><br><br>

          Your calculated lot size is
          <strong>${calculatedLotSize.toFixed(4)}</strong>
          lots, which is below your broker minimum of
          <strong>${brokerMinLot.toFixed(3)}</strong>
          lot.<br><br>

          Using the broker minimum would risk
          approximately
          <strong>$${riskAtMinimumLot.toFixed(2)}</strong>
          instead of your selected maximum risk of
          <strong>$${riskAmount.toFixed(2)}</strong>.<br><br>

          The calculator will NOT automatically increase
          your lot size because doing so would exceed
          your selected risk.

        </div>
      `;

    } else {

      lotMessage = `
        <div class="safe">

          <strong>Broker minimum notice</strong><br><br>

          Your calculated lot size is
          <strong>${calculatedLotSize.toFixed(4)}</strong>
          lots.<br><br>

          Your broker minimum is
          <strong>${brokerMinLot.toFixed(3)}</strong>
          lot.<br><br>

          The broker minimum would risk approximately
          <strong>$${riskAtMinimumLot.toFixed(2)}</strong>,
          which is within your selected risk limit.

        </div>
      `;

    }

  } else {

    lotMessage = `
      <div class="safe">

        The calculated lot size of
        <strong>${calculatedLotSize.toFixed(4)}</strong>
        lots is at or above your broker minimum of
        <strong>${brokerMinLot.toFixed(3)}</strong>
        lot.

      </div>
    `;
  }


  // ============================================
  // DISPLAY RESULTS
  // ============================================

  results.innerHTML = `

    <div class="result">

      <div class="result-row">
        <span>Currency Pair</span>
        <span class="value">
          ${pair}
        </span>
      </div>

      <div class="result-row">
        <span>Account Balance</span>
        <span class="value">
          $${balance.toFixed(2)}
        </span>
      </div>

      <div class="result-row">
        <span>Risk</span>
        <span class="value">
          ${riskPercent.toFixed(2)}%
        </span>
      </div>

      <div class="result-row">
        <span>Maximum Risk</span>
        <span class="value">
          $${riskAmount.toFixed(2)}
        </span>
      </div>

      <div class="result-row">
        <span>Entry</span>
        <span class="value">
          ${entry}
        </span>
      </div>

      <div class="result-row">
        <span>Stop Loss</span>
        <span class="value">
          ${stopLoss}
        </span>
      </div>

      <div class="result-row">
        <span>Take Profit</span>
        <span class="value">
          ${takeProfit}
        </span>
      </div>

      <div class="result-row">
        <span>Stop Distance</span>
        <span class="value">
          ${stopDistance.toFixed(5)}
        </span>
      </div>

      <div class="result-row">
        <span>Stop Distance (Pips)</span>
        <span class="value">
          ${stopPips.toFixed(1)}
        </span>
      </div>

      <div class="result-row">
        <span>Potential Reward</span>
        <span class="value">
          ${rewardRisk.toFixed(2)}R
        </span>
      </div>

      <div class="result-row">
        <span>Calculated Lot Size</span>
        <span class="value">
          ${calculatedLotSize.toFixed(4)}
        </span>
      </div>

      <div class="result-row">
        <span>Broker Minimum</span>
        <span class="value">
          ${brokerMinLot.toFixed(3)} lot
        </span>
      </div>

      <div class="result-row">
        <span>Risk at Broker Minimum</span>
        <span class="value">
          $${riskAtMinimumLot.toFixed(2)}
        </span>
      </div>

    </div>

    ${lotMessage}

    <div class="info">

      <strong>Risk Management Notice</strong><br><br>

      The calculated lot size is based on your
      selected account balance, risk percentage,
      entry price and stop-loss distance.

      <br><br>

      Broker contract specifications, pip values,
      minimum lot sizes and lot steps can differ.

      <br><br>

      Always verify the final lot size with your
      broker before placing a live trade.

    </div>

  `;
  }
  </script>

</body>
</html>
