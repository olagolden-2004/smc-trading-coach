<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SMC Risk Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #ffffff;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aab4c3;
      margin-bottom: 25px;
    }

    .card {
      background: #111b2e;
      border: 1px solid #26344d;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 7px;
      color: #dbe4f0;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #3b4b65;
      background: #0d1728;
      color: #ffffff;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      line-height: 1.8;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      border-bottom: 1px solid #26344d;
      padding: 10px 0;
    }

    .value {
      font-weight: bold;
      text-align: right;
    }

    .warning {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      background: #241c0d;
      border: 1px solid #735a21;
      color: #f5d98b;
      font-size: 13px;
    }

    .safe {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      background: #10251a;
      border: 1px solid #285c3a;
      color: #9be0b5;
      font-size: 13px;
    }

    .error {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      background: #291416;
      border: 1px solid #71343a;
      color: #ffb4b4;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SMC Risk Calculator</h1>

  <div class="subtitle">
    Calculate your trade risk before entering the market
  </div>

  <div class="card">

    <label>Instrument</label>

    <select id="instrument">
      <option value="xauusd">XAUUSD (Gold)</option>
      <option value="forex">Forex</option>
    </select>

    <label>Account Balance ($)</label>

    <input
      type="number"
      id="balance"
      placeholder="Example: 1000"
      step="0.01"
    >

    <label>Risk (%)</label>

    <input
      type="number"
      id="riskPercent"
      placeholder="Example: 1"
      value="1"
      step="0.01"
    >

    <label>Entry Price</label>

    <input
      type="number"
      id="entry"
      placeholder="Example: 3350"
      step="0.00001"
    >

    <label>Stop Loss</label>

    <input
      type="number"
      id="stopLoss"
      placeholder="Example: 3335"
      step="0.00001"
    >

    <label>Take Profit</label>

    <input
      type="number"
      id="takeProfit"
      placeholder="Example: 3380"
      step="0.00001"
    >

    <button onclick="calculateRisk()">
      CALCULATE RISK
    </button>

  </div>

  <div class="card">

    <h2>Risk Results</h2>

    <div id="results">
      Enter your trade information above.
    </div>

  </div>

</div>

<script>

function calculateRisk() {

  const instrument =
    document.getElementById("instrument").value;

  const balance =
    parseFloat(
      document.getElementById("balance").value
    );

  const riskPercent =
    parseFloat(
      document.getElementById("riskPercent").value
    );

  const entry =
    parseFloat(
      document.getElementById("entry").value
    );

  const stopLoss =
    parseFloat(
      document.getElementById("stopLoss").value
    );

  const takeProfit =
    parseFloat(
      document.getElementById("takeProfit").value
    );

  const results =
    document.getElementById("results");

  const BROKER_MIN_LOT = 0.01;


  if (
    !Number.isFinite(balance) ||
    !Number.isFinite(riskPercent) ||
    !Number.isFinite(entry) ||
    !Number.isFinite(stopLoss) ||
    !Number.isFinite(takeProfit)
  ) {

    results.innerHTML =
      `<div class="error">
        Please enter all trade information.
      </div>`;

    return;
  }


  if (balance <= 0) {

    results.innerHTML =
      `<div class="error">
        Account balance must be greater than zero.
      </div>`;

    return;
  }


  if (riskPercent <= 0 || riskPercent > 100) {

    results.innerHTML =
      `<div class="error">
        Risk percentage must be between 0.01% and 100%.
      </div>`;

    return;
  }


  if (entry === stopLoss) {

    results.innerHTML =
      `<div class="error">
        Entry and Stop Loss cannot be the same.
      </div>`;

    return;
  }


  if (entry === takeProfit) {

    results.innerHTML =
      `<div class="error">
        Entry and Take Profit cannot be the same.
      </div>`;

    return;
  }


  const riskAmount =
    balance * (riskPercent / 100);


  const stopDistance =
    Math.abs(entry - stopLoss);


  const targetDistance =
    Math.abs(takeProfit - entry);


  const rewardRisk =
    targetDistance / stopDistance;


  let calculatedLotSize;


  /*
    XAUUSD calculation

    Assumption:
    1 standard lot = 100 ounces.

    Risk per 1.00 lot =
    stop distance × 100
  */

  if (instrument === "xauusd") {

    const riskPerOneLot =
      stopDistance * 100;

    calculatedLotSize =
      riskAmount / riskPerOneLot;

  } else {

    /*
      Simplified forex calculation.

      Assumes USD quote currency.

      Standard lot = 100,000 units.
      Approximate pip value = $10 per lot.
    */

    const pipSize = 0.0001;

    const stopPips =
      stopDistance / pipSize;

    const pipValuePerLot = 10;

    calculatedLotSize =
      riskAmount /
      (stopPips * pipValuePerLot);
  }


  if (
    !Number.isFinite(calculatedLotSize) ||
    calculatedLotSize <= 0
  ) {

    results.innerHTML =
      `<div class="error">
        Unable to calculate a valid lot size.
      </div>`;

    return;
  }


  /*
    Keep the real calculated value.

    DO NOT round 0.0067 to 0.00.
  */

  const exactLot =
    calculatedLotSize;


  /*
    Calculate what would happen if the
    broker minimum of 0.01 lot were used.
  */

  let riskAtMinimumLot;

  if (instrument === "xauusd") {

    riskAtMinimumLot =
      stopDistance * 100 * BROKER_MIN_LOT;

  } else {

    const pipSize = 0.0001;

    const stopPips =
      stopDistance / pipSize;

    riskAtMinimumLot =
      stopPips * 10 * BROKER_MIN_LOT;
  }


  const minimumLotExceedsRisk =
    riskAtMinimumLot > riskAmount;


  let lotMessage = "";


  if (exactLot < BROKER_MIN_LOT) {

    lotMessage = `
      <div class="warning">
        <strong>Broker minimum warning:</strong><br><br>

        Your calculated lot size is
        <strong>${exactLot.toFixed(4)}</strong> lots,
        which is below your broker minimum of
        <strong>0.01 lot</strong>.<br><br>

        Using 0.01 lot would risk approximately
        <strong>$${riskAtMinimumLot.toFixed(2)}</strong>
        instead of your selected
        <strong>$${riskAmount.toFixed(2)}</strong> risk.<br><br>

        The calculator will NOT automatically increase
your lot size to 0.01 because doing so would
exceed your selected risk.
      </div>
    `;

  } else {

    lotMessage = `
      <div class="safe">
        The calculated lot size is above your
        broker minimum of 0.01 lot.
      </div>
    `;
  }


  results.innerHTML = `

    <div class="result">

      <div class="result-row">
        <span>Account Balance</span>
        <span class="value">
          $${balance.toFixed(2)}
        </span>
      </div>

      <div class="result-row">
        <span>Risk</span>
        <span class="value">
          ${riskPercent.toFixed(2)}%
        </span>
      </div>

      <div class="result-row">
        <span>Maximum Risk</span>
        <span class="value">
          $${riskAmount.toFixed(2)}
        </span>
      </div>

      <div class="result-row">
        <span>Entry</span>
        <span class="value">
          ${entry}
        </span>
      </div>

      <div class="result-row">
        <span>Stop Loss</span>
        <span class="value">
          ${stopLoss}
        </span>
      </div>

      <div class="result-row">
        <span>Take Profit</span>
        <span class="value">
          ${takeProfit}
        </span>
      </div>

      <div class="result-row">
        <span>Stop Distance</span>
        <span class="value">
          ${stopDistance.toFixed(5)}
        </span>
      </div>

      <div class="result-row">
        <span>Potential Reward</span>
        <span class="value">
          ${rewardRisk.toFixed(2)}R
        </span>
      </div>

      <div class="result-row">
        <span>Calculated Lot Size</span>
        <span class="value">
          ${exactLot.toFixed(4)}
        </span>
      </div>

      <div class="result-row">
        <span>Broker Minimum</span>
        <span class="value">
          0.01 lot
        </span>
      </div>

      <div class="result-row">
        <span>Risk at 0.01 Lot</span>
        <span class="value">
          $${riskAtMinimumLot.toFixed(2)}
        </span>
      </div>

    </div>

    ${lotMessage}

    <div class="warning">
      This calculator is for risk-management planning.
      Broker contract specifications can differ.
      Always verify the final lot size and risk with
      your broker before placing a trade.
    </div>

  `;

}

</script>

</body>
  </html>
