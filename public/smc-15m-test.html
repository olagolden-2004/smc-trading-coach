<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMC 15M Test</title>
</head>

<body>
  <h2>SMC 15M Analysis Test</h2>

  <p>Select your 15M TradingView chart:</p>

  <input type="file" id="chart" accept="image/*">

  <br><br>

  <button onclick="analyze15M()">
    Analyze 15M
  </button>

  <pre id="result">Waiting...</pre>

  <script>
    async function analyze15M() {
      const fileInput = document.getElementById("chart");
      const result = document.getElementById("result");

      if (!fileInput.files.length) {
        result.textContent =
          "Please select a 15M chart first.";
        return;
      }

      result.textContent =
        "Analyzing 15M chart...";

      const formData = new FormData();

      formData.append(
        "chart",
        fileInput.files[0]
      );

      try {
        const response = await fetch(
          "/smc-analysis-15m",
          {
            method: "POST",
            body: formData
          }
        );

        const data = await response.json();

        result.textContent =
          JSON.stringify(data, null, 2);

      } catch (error) {
        result.textContent =
          "Error: " + error.message;
      }
    }
  </script>
</body>
</html>
